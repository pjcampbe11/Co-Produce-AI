# CoProduce AI SaaS - API + worker + Redis.  `docker compose up --build`
# For a real GPU worker, add the override:  docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: server/Dockerfile }
    env_file: server/.env
    depends_on: [redis]
    ports: ["8000:8000"]
    volumes: ["beatdata:/data"]
    restart: unless-stopped

  # Dev worker: consumes BOTH lanes (CPU + GPU). In production, restrict this to
  # the CPU lane and run a GPU worker via docker-compose.gpu.yml.
  worker:
    build: { context: ., dockerfile: server/Dockerfile }
    env_file: server/.env
    depends_on: [redis]
    command: ["python", "-m", "server.worker"]
    volumes: ["beatdata:/data"]
    restart: unless-stopped
    # scale with: docker compose up --scale worker=3

volumes:
  beatdata:
