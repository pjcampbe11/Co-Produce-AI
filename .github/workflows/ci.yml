name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install server deps
        run: pip install -r server/requirements.txt
      - name: Run test suite (fakeredis, no infra)
        working-directory: server
        run: pytest -q

  compile-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile all toolkit scripts
        run: python -m compileall -q scripts server clients/python dashboard.py
